name: KAL Award Seat Web Dataset Builder

on:
  schedule:
    # 매시 정각마다 자동 실행 (UTC 기준 0분, 1시간 주기, WAF 밴 방지)
    - cron: '0 * * * *'
  # GitHub 웹사이트에서 언제든 [Run workflow] 버튼으로 즉시 실행 가능
  workflow_dispatch:

concurrency:
  group: kal-dataset-builder
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Python is in PATH
        run: |
          $pyCandidates = @(
            "C:\Users\aumie\AppData\Local\Programs\Python\Python314",
            "C:\Users\aumie\AppData\Local\Programs\Python\Python314\Scripts"
          )
          foreach ($p in $pyCandidates) {
            if (Test-Path $p) {
              Add-Content $env:GITHUB_PATH $p
            }
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Build Web Dataset for GitHub Pages (Up to 14 Months)
        run: |
          python src/build_static_data.py 14

      - name: Commit & push updated dataset to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest_seats.json
          $status = git status --porcelain docs/data/latest_seats.json
          if ($status) {
            git commit -m "chore: auto-update award seat dataset [skip ci]"
            git push origin main
          } else {
            Write-Host "No changes in latest_seats.json to commit."
          }
